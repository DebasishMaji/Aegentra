name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python examples/refund_recovery.py
      - run: uv run python examples/adversarial_testing.py
      - run: uv build
      - name: Exercise the installed wheel outside the checkout
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/aegentra-wheel"
          uv pip install --python "$RUNNER_TEMP/aegentra-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" --version
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" lab > "$RUNNER_TEMP/aegentra-lab-report.json"
          "$RUNNER_TEMP/aegentra-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/refund_recovery.py" --directory "$RUNNER_TEMP/aegentra-demo"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" trace "$RUNNER_TEMP/aegentra-demo/agent.sqlite3" \
            --tenant shop --account payments --operation-id approved-refund-42 \
            > "$RUNNER_TEMP/aegentra-demo-trace.json"
          "$RUNNER_TEMP/aegentra-wheel/bin/python" "$GITHUB_WORKSPACE/examples/adversarial_testing.py"
          search_status=0
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" test-agent \
            --case-out "$RUNNER_TEMP/aegentra-counterexample.json" \
            > "$RUNNER_TEMP/aegentra-search.json" || search_status=$?
          test "$search_status" -eq 3
          replay_status=0
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" replay-test \
            "$RUNNER_TEMP/aegentra-counterexample.json" --target unsafe_retry \
            > "$RUNNER_TEMP/aegentra-unsafe.json" || replay_status=$?
          test "$replay_status" -eq 3
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" replay-test \
            "$RUNNER_TEMP/aegentra-counterexample.json" --target aegentra \
            > "$RUNNER_TEMP/aegentra-guarded.json"
