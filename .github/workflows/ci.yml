name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra langgraph --python "${{ matrix.python }}"
      - name: Verify the matrix interpreter
        run: |
          uv run --locked --extra langgraph python -c \
            "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']"
      - run: uv run --locked --extra langgraph ruff check .
      - run: uv run --locked --extra langgraph ruff format --check .
      - run: uv run --locked --extra langgraph mypy
      - run: uv run --locked --extra langgraph pytest
      - run: uv run --locked --extra langgraph python examples/refund_recovery.py
      - run: uv run --locked --extra langgraph python examples/adversarial_testing.py
      - run: uv run --locked --extra langgraph python examples/langgraph_refund.py
      - run: uv build
      - name: Exercise the installed wheel outside the checkout
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/aegentra-wheel"
          uv pip install --python "$RUNNER_TEMP/aegentra-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aegentra-wheel/bin/python" -c \
            "import aegentra, importlib.util; assert importlib.util.find_spec('langgraph') is None"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" --version
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" lab > "$RUNNER_TEMP/aegentra-lab-report.json"
          "$RUNNER_TEMP/aegentra-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/refund_recovery.py" --directory "$RUNNER_TEMP/aegentra-demo"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" trace "$RUNNER_TEMP/aegentra-demo/agent.sqlite3" \
            --tenant shop --account payments --operation-id approved-refund-42 \
            > "$RUNNER_TEMP/aegentra-demo-trace.json"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" status "$RUNNER_TEMP/aegentra-demo/agent.sqlite3"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" snapshot "$RUNNER_TEMP/aegentra-demo/agent.sqlite3" \
            --out "$RUNNER_TEMP/aegentra-snapshot.sqlite3"
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" list "$RUNNER_TEMP/aegentra-snapshot.sqlite3" \
            --knowledge all
          "$RUNNER_TEMP/aegentra-wheel/bin/python" - "$RUNNER_TEMP/aegentra-snapshot.sqlite3" <<'PY'
          import sys
          from aegentra import Runtime, SnapshotUsageError
          try:
              with Runtime(sys.argv[1], require_existing=True):
                  raise AssertionError("An inspection snapshot was accepted as live state.")
          except SnapshotUsageError:
              pass
          PY
          "$RUNNER_TEMP/aegentra-wheel/bin/python" "$GITHUB_WORKSPACE/examples/adversarial_testing.py"
          search_status=0
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" test-agent \
            --case-out "$RUNNER_TEMP/aegentra-counterexample.json" \
            > "$RUNNER_TEMP/aegentra-search.json" || search_status=$?
          test "$search_status" -eq 3
          replay_status=0
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" replay-test \
            "$RUNNER_TEMP/aegentra-counterexample.json" --target unsafe_retry \
            > "$RUNNER_TEMP/aegentra-unsafe.json" || replay_status=$?
          test "$replay_status" -eq 3
          "$RUNNER_TEMP/aegentra-wheel/bin/aegentra" replay-test \
            "$RUNNER_TEMP/aegentra-counterexample.json" --target aegentra \
            > "$RUNNER_TEMP/aegentra-guarded.json"
      - name: Exercise the optional integration from the installed wheel
        run: |
          uv export --locked --extra langgraph --no-dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/aegentra-integration-constraints.txt"
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            uv pip install --python "$RUNNER_TEMP/aegentra-wheel/bin/python" \
              --constraint "$RUNNER_TEMP/aegentra-integration-constraints.txt" "${wheel}[langgraph]"
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aegentra-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/langgraph_refund.py"
